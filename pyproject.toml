[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "future-rag"
version = "0.1.0"
description = "A modular Retrieval-Augmented Generation (RAG) framework supporting Basic, Hybrid, Graph, Agentic, and Multimodal RAG architectures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Saman Barakat" }
]

keywords = [
    "rag",
    "llm",
    "llamaindex",
    "retrieval",
    "ai",
    "nlp",
    "vector-database",
    "knowledge-graph"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"